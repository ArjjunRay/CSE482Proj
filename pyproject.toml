[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "nascar-performance-lab"
version = "0.1.0"
description = "Leakage-aware NASCAR performance modeling and prediction API"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Arjun Ray" },
  { name = "Aaryaman Bisht" },
  { name = "Adhiraj Nimbalkar" },
  { name = "Tolu Fashina" },
  { name = "Noah Zemba" },
]
keywords = ["nascar", "machine-learning", "sports-analytics", "fastapi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.115,<1",
  "joblib>=1.4,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "requests>=2.32,<3",
  "scikit-learn>=1.5,<2",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
]

[project.scripts]
nascar-performance = "nascar_performance.cli:main"

[project.urls]
Repository = "https://github.com/ArjjunRay/nascar-performance-lab"
Issues = "https://github.com/ArjjunRay/nascar-performance-lab/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/nascar_performance"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=nascar_performance --cov-report=term-missing"
testpaths = ["tests"]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

